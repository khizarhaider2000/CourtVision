name: Keep Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from spinning down
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ vars.RENDER_APP_URL }}")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "App is alive."
          else
            echo "Warning: unexpected status $STATUS"
          fi
